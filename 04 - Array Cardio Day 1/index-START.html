			// Array.prototype.filter()
			// 1. Filter the list of inventors for those who were born in the 1500's
			const filterInventors = inventors.filter(
				(el) => el.year >= 1500 && el.year < 1600,
			);

			// Array.prototype.map()
			// 2. Give us an array of the inventors first and last names
			const mappedInventors = inventors.map(
				(el) => el.first + " " + el.last,
			);

			// Array.prototype.sort()
			// 3. Sort the inventors by birthdate, oldest to youngest
			const sortedInventors = inventors.sort((a, b) => a.year - b.year);

			// Array.prototype.reduce()
			// 4. How many years did all the inventors live all together?
			const reducedInventors = inventors.reduce(
				(acc, el) => acc - (el.year - el.passed),
				0,
			);
			console.log(reducedInventors);

			// 5. Sort the inventors by years lived
			// i have to write more legible, maybe whem using sort return 1, -1 being explicit

			// ? 6. create a list of Boulevards in Paris that contain 'de' anywhere in the name

			// 7. sort Exercise
			// Sort the people alphabetically by last name
			// theoretically yes it works, but at large scale maybe no
			// it works with only sort
			let sortedPeople = Array.from(people);
			sortedPeople = sortedPeople.sort((lastName, nextName) => {
				let [aLast, aFirst] = lastName.split(", ");
				let [bLast, bFirst] = nextName.split(", ");
				return bLast > aLast ? -1 : 1;
			});
			console.log(sortedPeople);

			// 8. Reduce Exercise
			// Sum up the instances of each of these
			const data = [
				"car",
				"car",
				"truck",
				"truck",
				"bike",
				"walk",
				"car",
				"van",
				"bike",
				"walk",
				"car",
				"van",
				"car",
				"truck",
			];
			// at least i did it alone
			const dataReduced = data.reduce(
				(ob, word, i) => {
					let car = ob.car;
					let van = ob.van;
					let walk = ob.walk;
					let truck = ob.truck;
					let bike = ob.bike;
					if (word.includes("car")) {
						car++;
					}
					if (word.includes("van")) {
						van++;
					}
					if (word.includes("walk")) {
						walk++;
					}
					if (word.includes("truck")) {
						truck++;
					}
					if (word.includes("bike")) {
						bike++;
					}
					ob.car = car;
					ob.van = van;
					ob.walk = walk;
					ob.truck = truck;
					ob.bike = bike;
					return ob;
				},
				{
					car: 0,
					van: 0,
					walk: 0,
					truck: 0,
					bike: 0,
				},
			);
			console.log(dataReduced);
